query($q: String!, $after: String, $first: Int!, $withFiles: Boolean!) {
  search(query: $q, type: ISSUE, first: $first, after: $after) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes {
      ... on PullRequest {
        number
        title
        url
        isDraft
        state
        createdAt
        updatedAt
        mergedAt
        body
        headRefName
        headRefOid
        baseRefName
        additions
        deletions
        changedFiles
        isInMergeQueue
        mergeable
        mergeStateStatus
        reviewDecision
        author { login }
        repository { nameWithOwner defaultBranchRef { name } }
        labels(first: 30) { nodes { name } }
        reviewRequests(first: 20) {
          nodes { requestedReviewer { __typename ... on User { login } ... on Team { slug } } }
        }
        latestReviews(first: 30) { nodes { author { login } state submittedAt } }
        reviewThreads(first: 50) {
          nodes {
            isResolved
            isOutdated
            path
            comments(first: 1) { nodes { author { login } body url createdAt } }
          }
        }
        commits(last: 1) {
          nodes {
            commit {
              committedDate
              statusCheckRollup {
                state
                contexts(first: 100) {
                  nodes {
                    __typename
                    ... on CheckRun { name conclusion status detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  }
                }
              }
            }
          }
        }
        timelineItems(last: 40, itemTypes: [REVIEW_REQUESTED_EVENT, HEAD_REF_FORCE_PUSHED_EVENT, REMOVED_FROM_MERGE_QUEUE_EVENT, PULL_REQUEST_REVIEW, ISSUE_COMMENT]) {
          nodes {
            __typename
            ... on ReviewRequestedEvent { createdAt requestedReviewer { __typename ... on User { login } ... on Team { slug } } }
            ... on HeadRefForcePushedEvent { createdAt }
            ... on RemovedFromMergeQueueEvent { createdAt reason }
            ... on PullRequestReview { createdAt author { login } }
            ... on IssueComment { createdAt author { login } }
          }
        }
        files(first: 100) @include(if: $withFiles) { nodes { path } }
      }
    }
  }
}
