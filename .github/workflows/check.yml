# Runs every check (formatting, lint, types, tests) on Linux, macOS and Windows: once per
# pull request (on the merge GitHub would make), and on whatever lands on main.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its run still going, which no longer says anything about
# it and holds runners the new one needs. Runs on main all finish: each says whether that merge
# left main working.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: python dev.py check

  # The one check the ruleset on main requires, so changing the matrix doesn't change what's
  # required. It runs even if a check failed (a skipped required check would count as
  # passing), and fails unless every check passed.
  passed:
    name: CI passed
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check passed
        if: needs.check.result != 'success'
        run: exit 1
