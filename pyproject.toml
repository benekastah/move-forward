[project]
name = "move-forward"
version = "0.1.0"
description = "Local dashboard of PRs, stacks, local work and Jira tickets that need attention."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Harper", email = "benekastah@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    # 0.0.3 development build, pinned by commit: a tag can be moved, and pip (dev.py without uv) doesn't read uv.lock.
    "py-git-client @ git+https://github.com/benekastah/py-git-client@85cfd8a1f918c7e9b07007465292c1cce9f1bb2a",
    "pydantic>=2.14.3",
    "watchfiles>=1.3.0",
]

[project.scripts]
mfd = "move_forward.cli:main"

[dependency-groups]
# The template's dev tools, kept current by `copier update`; the project's own go in `dev`
# (`uv add --dev`), so the two never conflict.
template-dev = [
    "basedpyright>=1.40.2",
    "coverage>=7.17.3",
    # pandoc, for dev.py man. Pinned: `man --check` compares its exact output with the pages.
    # It has no wheel for Windows on ARM, so dev.py venv fails there.
    "pypandoc_binary==1.17",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]
dev = [
    { include-group = "template-dev" },
    "tzdata>=2026.6",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

# py-git-client is installed from its git repository (it isn't on PyPI), which hatchling
# refuses unless allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/move_forward"]

[tool.pytest]
testpaths = ["tests"]
# One worker per CPU (pytest-xdist); `-n 0` runs them one at a time, e.g. to debug.
# py-git-client's pytest plugin keeps git to itself in every test and session fixture: a global
# config of the tests' own (an identity, no background maintenance, none of the developer's
# ignore or attributes files), no system config, none of git's variables that would win over
# them, GIT_ALLOW_PROTOCOL=file (no network) and no asking for a password; and it builds
# repos once per session (`repo_templates`). Loaded here rather than from conftest.py, which
# imports it, so pytest can rewrite its asserts.
addopts = ["--numprocesses", "auto", "-p", "git_client.testing"]
markers = ["private_files: makes its files private for real (conftest's `private_files`)"]

[tool.ruff]
line-length = 100
target-version = "py315"
# dev.py runs under an older Python too, to say it's too old: keep it to syntax that parses there.
per-file-target-version = { "dev.py" = "py311", "dev_project.py" = "py311" }

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    # The project's own below:
    "TID251",
    "TID252",
]

[tool.ruff.lint.flake8-tidy-imports]
# Imports name the module in full (move_forward.graph, not .graph), as AGENTS.md asks: what's
# imported reads the same everywhere, and the plugin import ban below sees every import of core.
ban-relative-imports = "all"

# Plugins use core only through move_forward.api (see PROJECT_AGENTS.md), and run git through its
# `api.git`, not py-git-client directly; core itself may use all.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"git_client".msg = "plugins run git through move_forward.api.git"
"move_forward.act_now".msg = "plugins import from move_forward.api"
"move_forward.asking".msg = "plugins import from move_forward.api"
"move_forward.auth".msg = "plugins import from move_forward.api"
"move_forward.change_checks".msg = "plugins import from move_forward.api"
"move_forward.cli".msg = "plugins import from move_forward.api"
"move_forward.config".msg = "plugins import from move_forward.api"
"move_forward.db".msg = "plugins import from move_forward.api"
"move_forward.domain".msg = "plugins import from move_forward.api"
"move_forward.git".msg = "plugins import from move_forward.api"
"move_forward.graph".msg = "plugins import from move_forward.api"
"move_forward.https".msg = "plugins import from move_forward.api"
"move_forward.ids".msg = "plugins import from move_forward.api"
"move_forward.init".msg = "plugins import from move_forward.api"
"move_forward.keychain".msg = "plugins import from move_forward.api"
"move_forward.kinds".msg = "plugins import from move_forward.api"
"move_forward.localtime".msg = "plugins import from move_forward.api"
"move_forward.lookups".msg = "plugins import from move_forward.api"
"move_forward.markdown".msg = "plugins import from move_forward.api"
"move_forward.markup".msg = "plugins import from move_forward.api"
"move_forward.notifications".msg = "plugins import from move_forward.api"
"move_forward.page".msg = "plugins import from move_forward.api"
"move_forward.panels".msg = "plugins import from move_forward.api"
"move_forward.people".msg = "plugins import from move_forward.api"
"move_forward.plugin".msg = "plugins import from move_forward.api"
"move_forward.priority".msg = "plugins import from move_forward.api"
"move_forward.private".msg = "plugins import from move_forward.api"
"move_forward.prune".msg = "plugins import from move_forward.api"
"move_forward.refresh".msg = "plugins import from move_forward.api"
"move_forward.registry".msg = "plugins import from move_forward.api"
"move_forward.reload".msg = "plugins import from move_forward.api"
"move_forward.render".msg = "plugins import from move_forward.api"
"move_forward.repositories".msg = "plugins import from move_forward.api"
"move_forward.server".msg = "plugins import from move_forward.api"
"move_forward.settings".msg = "plugins import from move_forward.api"
"move_forward.shell".msg = "plugins import from move_forward.api"
"move_forward.signin".msg = "plugins import from move_forward.api"
"move_forward.snooze".msg = "plugins import from move_forward.api"
"move_forward.strict".msg = "plugins import from move_forward.api"
"move_forward.supervisor".msg = "plugins import from move_forward.api"
"move_forward.tag_view".msg = "plugins import from move_forward.api"
"move_forward.tags".msg = "plugins import from move_forward.api"
"move_forward.testing".msg = "plugins import from move_forward.api"
"move_forward.text".msg = "plugins import from move_forward.api"
"move_forward.tomledit".msg = "plugins import from move_forward.api"

[tool.ruff.lint.per-file-ignores]
"!src/move_forward/plugins/**" = ["TID251"]

[tool.basedpyright]
include = [
    "src",
    "tests",
    "dev.py",
    # The project's own below:
    "dev_project.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.15"
reportMissingModuleSource = false

[tool.coverage.run]
source = ["move_forward"]
branch = true
# Measure each pytest-xdist worker, a process of its own, in a data file of its own, which
# `dev.py coverage` combines.
parallel = true
patch = ["subprocess"]
# pytest-xdist's main process runs no tests, so it measures nothing: not worth a warning.
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
show_missing = true
skip_covered = true
