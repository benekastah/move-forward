[project]
name = "move-forward"
version = "0.1.0"
description = "Local dashboard of PRs, stacks, local work and Jira tickets that need attention."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["cryptography>=50.0.2", "pydantic>=2.7", "watchfiles>=1.3.0"]

[project.scripts]
mfd = "move_forward.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.8.0", "ruff>=0.6", "basedpyright>=1.18", "coverage>=7.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/move_forward"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM", "TID251"]

# Plugins use core only through move_forward.api (see AGENTS.md); core itself may use all.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"move_forward.act_now".msg = "plugins import from move_forward.api"
"move_forward.asking".msg = "plugins import from move_forward.api"
"move_forward.auth".msg = "plugins import from move_forward.api"
"move_forward.cli".msg = "plugins import from move_forward.api"
"move_forward.config".msg = "plugins import from move_forward.api"
"move_forward.db".msg = "plugins import from move_forward.api"
"move_forward.domain".msg = "plugins import from move_forward.api"
"move_forward.graph".msg = "plugins import from move_forward.api"
"move_forward.https".msg = "plugins import from move_forward.api"
"move_forward.ids".msg = "plugins import from move_forward.api"
"move_forward.init".msg = "plugins import from move_forward.api"
"move_forward.keychain".msg = "plugins import from move_forward.api"
"move_forward.kinds".msg = "plugins import from move_forward.api"
"move_forward.localtime".msg = "plugins import from move_forward.api"
"move_forward.markdown".msg = "plugins import from move_forward.api"
"move_forward.notifications".msg = "plugins import from move_forward.api"
"move_forward.page".msg = "plugins import from move_forward.api"
"move_forward.panels".msg = "plugins import from move_forward.api"
"move_forward.plugin".msg = "plugins import from move_forward.api"
"move_forward.priority".msg = "plugins import from move_forward.api"
"move_forward.private".msg = "plugins import from move_forward.api"
"move_forward.prune".msg = "plugins import from move_forward.api"
"move_forward.refresh".msg = "plugins import from move_forward.api"
"move_forward.registry".msg = "plugins import from move_forward.api"
"move_forward.reload".msg = "plugins import from move_forward.api"
"move_forward.render".msg = "plugins import from move_forward.api"
"move_forward.repositories".msg = "plugins import from move_forward.api"
"move_forward.server".msg = "plugins import from move_forward.api"
"move_forward.settings".msg = "plugins import from move_forward.api"
"move_forward.shell".msg = "plugins import from move_forward.api"
"move_forward.signin".msg = "plugins import from move_forward.api"
"move_forward.snooze".msg = "plugins import from move_forward.api"
"move_forward.strict".msg = "plugins import from move_forward.api"
"move_forward.supervisor".msg = "plugins import from move_forward.api"
"move_forward.tls".msg = "plugins import from move_forward.api"
"move_forward.tomledit".msg = "plugins import from move_forward.api"

[tool.ruff.lint.per-file-ignores]
"!src/move_forward/plugins/**" = ["TID251"]

[tool.basedpyright]
include = ["src", "tests", "dev.py"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingModuleSource = false

[tool.coverage.run]
source = ["move_forward"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
