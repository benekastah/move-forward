[project]
name = "move-forward"
version = "0.1.0"
description = "Local dashboard of PRs, stacks, local work and Jira tickets that need attention."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["cryptography>=50.0.2", "pydantic>=2.7"]

[project.scripts]
mfd = "move_forward.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "basedpyright>=1.18", "coverage>=7.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/move_forward"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM"]

[tool.basedpyright]
include = ["src", "tests", "dev.py"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingModuleSource = false

[tool.coverage.run]
source = ["move_forward"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
